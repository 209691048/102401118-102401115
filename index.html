<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园寻物</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
    <header class="top-bar">
        <button id="backBtn" class="back-btn" hidden>‹</button>
        <h1 id="pageTitle">校园寻物</h1>
    </header>

    <main class="main-content">
        <section id="homePage">
            <div class="search-box">
                <span class="search-icon">⌕</span>
                <input type="text" id="searchInput" placeholder="搜索物品名称">
                <button id="searchBtn">搜索</button>
            </div>

            <div class="category-tabs">
                <button class="category-btn active" data-type="全部">全部</button>
                <button class="category-btn" data-type="寻物">寻物</button>
                <button class="category-btn" data-type="招领">招领</button>
            </div>

            <section class="section">
                <div class="section-title">
                    <h2>最新信息</h2>
                    <span id="resultCount"></span>
                </div>
                <div id="itemList" class="item-list"></div>
            </section>
        </section>

<section id="detailPage" hidden>
    <div id="detailContent"></div>
</section>

<section id="publishPage" hidden>
    <div class="form-card">
        <h2>发布失物招领</h2>
        <p class="form-tip">请填写物品信息，方便同学们查找。</p>

        <form id="publishForm">
            <label for="itemTitle">物品名称 *</label>
            <input id="itemTitle" name="title" type="text"
                   placeholder="例如：黑色校园卡" maxlength="40" required>

            <label for="itemType">信息类型 *</label>
            <select id="itemType" name="type" required>
                <option value="寻物">寻物（我丢失了物品）</option>
                <option value="招领">招领（我捡到了物品）</option>
            </select>

            <label for="itemLocation">地点 *</label>
            <input id="itemLocation" name="location" type="text"
                   placeholder="例如：图书馆二楼" maxlength="80" required>

            <label for="itemDate">日期 *</label>
            <input id="itemDate" name="date" type="date" required>

            <label for="itemDescription">详细描述 *</label>
            <textarea id="itemDescription" name="description"
                      placeholder="请描述物品特征、遗失或捡到的情况"
                      maxlength="500" rows="4" required></textarea>

            <label for="itemContactName">联系人</label>
            <input id="itemContactName" name="contactName" type="text"
                   placeholder="可以填写昵称" maxlength="30">

            <label for="itemContact">联系方式 *</label>
            <input id="itemContact" name="contact" type="text"
                   placeholder="建议使用校园内安全、合适的联系方式"
                   maxlength="100" required>

            <button class="primary-btn" type="submit">提交发布</button>
            <button class="secondary-btn" type="button" id="cancelPublishBtn">
                取消
            </button>
        </form>
    </div>
</section>


<section id="editPage" hidden>
    <div class="form-card">
        <h2>编辑信息</h2>
        <p class="form-tip">修改后点击保存；取消或返回不会保存本次修改。</p>
        <p id="editFeedback" role="alert" hidden></p>
        <form id="editForm">
            <label for="editTitle">物品名称 *</label>
            <input id="editTitle" name="title" type="text" maxlength="40" required>
            <label for="editType">信息类型</label>
            <select id="editType" name="type" disabled>
                <option value="寻物">寻物（我丢失了物品）</option>
                <option value="招领">招领（我捡到了物品）</option>
            </select>
            <label for="editLocation">地点 *</label>
            <input id="editLocation" name="location" type="text" maxlength="80" required>
            <label for="editDate">日期 *</label>
            <input id="editDate" name="date" type="date" required>
            <label for="editDescription">详细描述 *</label>
            <textarea id="editDescription" name="description" maxlength="500" rows="4" required></textarea>
            <label for="editContactName">联系人</label>
            <input id="editContactName" name="contactName" type="text" maxlength="30">
            <label for="editContact">联系方式 *</label>
            <input id="editContact" name="contact" type="text" maxlength="100" required>
            <button class="primary-btn" type="submit">保存修改</button>
            <button class="secondary-btn" type="button" id="cancelEditBtn">取消</button>
        </form>
    </div>
</section>

<section id="successPage" hidden>
    <div class="success-card">
        <div class="success-icon">✓</div>
        <h2>发布成功</h2>
        <p>你的信息已经保存，可以返回首页查看。</p>
        <button class="primary-btn" id="successHomeBtn">返回首页</button>
        <button class="secondary-btn" id="successMineBtn">查看我的发布</button>
    </div>
</section>

<section id="minePage" hidden>
    <div class="section-title">
        <h2>我的发布</h2>
        <span id="mineCount"></span>
    </div>
    <p id="mineFeedback" role="status" hidden></p>
    <div id="mineList" class="item-list"></div>
</section>
    </main>

    <nav class="bottom-nav">
        <button class="nav-btn active" id="homeNavBtn">
            <span>⌂</span>
            <small>首页</small>
        </button>
        <button class="nav-btn" id="publishNavBtn">
            <span>＋</span>
            <small>发布</small>
        </button>
        <button class="nav-btn" id="mineNavBtn">
            <span>♙</span>
            <small>我的</small>
        </button>
    </nav>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>

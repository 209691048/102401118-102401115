name: Campus Lost Found Tests

on:
  push:
    branches:
      - main
      - "fix-*"
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          node --check js/app.js
          node --check js/data.js
          node --check tests/browser-test.js
          node --check tests/ownership-test.cjs

      - name: Run ownership and edit tests
        run: node tests/ownership-test.cjs
        # trigger pull request check

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园寻物自动化测试</title>
    <style>
        body {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                sans-serif;
            color: #222;
            line-height: 1.6;
        }

        h1 {
            font-size: 26px;
        }

        button {
            padding: 10px 18px;
            border: 0;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        #summary {
            margin: 20px 0;
            font-weight: bold;
        }

        #results {
            padding: 0;
            list-style: none;
        }

        #results li {
            margin: 10px 0;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .pass {
            color: #15803d;
        }

        .fail {
            color: #b91c1c;
        }

        #details {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        iframe {
            position: absolute;
            width: 1px;
            height: 1px;
            left: -10000px;
            border: 0;
        }
    </style>
</head>
<body>
    <h1>校园寻物 Web 自动化测试</h1>

    <p>
        本页面通过浏览器测试实际的校园寻物应用，
        无需安装 Node.js。
    </p>

    <button id="runTests" type="button">开始测试</button>

    <div id="summary">等待运行测试。</div>
    <ol id="results"></ol>
    <pre id="details"></pre>

    <iframe id="appFrame" title="待测试的校园寻物应用"></iframe>

    <script src="browser-test.js"></script>
</body>
</html>
